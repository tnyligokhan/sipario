name: Manifest Lint (Kırmızı Çizgi #6)

# Kaynak-manifest izin bekçisi — Flutter/Android build GEREKTİRMEZ, saf bash grep, saniyeler sürer.
# BRIEF kırmızı çizgi #6'nın "otomatik testlerle sürekli kanıtla" şartının hafif katmanı: kendi
# AndroidManifest.xml'imizde bir yasaklı SMS/Call Log izni plain beyan edilirse (tools:node="remove"
# olmadan) ya da READ_CONTACTS / CallScreeningService düşerse build'i kırar.
#
# İKİNCİ KATMAN ARTIK BAĞLI (2026-08-17): 3. parti paketlerin manifest-merger ile enjekte ettiği izinler
# yalnız BİRLEŞTİRİLMİŞ manifest'te görünür ve onları `scripts/check_permissions.sh` denetler. O betik
# aylarca YAZILI AMA ÇAĞRILMAMIŞ durdu; şimdi `mobil-apk.yml` içinde APK derlemesinden sonra koşuyor ve
# `magaza` kanalının manifest'ini de ayrıca üretip denetliyor (o kanal hiçbir dalda derlenmiyor).
#
# BU WORKFLOW YİNE DE GEREKLİ: build'siz, saniyeler sürüyor ve mobil derleme hiç başlamadan PR'da
# kırmızı yakıyor. İkisi farklı soruyu soruyor — burası "biz mi yazdık?", öteki "birleşince ne oldu?".

on:
  push:
    paths:
      - 'apps/mobile/android/app/src/main/AndroidManifest.xml'
      - 'scripts/check_permissions_source.sh'
      - '.github/workflows/manifest-lint.yml'
  pull_request:
    paths:
      - 'apps/mobile/android/app/src/main/AndroidManifest.xml'
      - 'scripts/check_permissions_source.sh'
      - '.github/workflows/manifest-lint.yml'

jobs:
  manifest-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kaynak manifest izin denetimi (kırmızı çizgi #6)
        run: bash scripts/check_permissions_source.sh
