# SAHA APK — tam otomatik güncelleme hattı (kullanıcı kararı 2026-07-28:
# "sürekli APK paylaşmak istemiyorum, tam otomatik bir sistem istiyorum").
#
# Akış: dev'e mobil dokunuşlu her push → arm64 + evrensel APK derlenir, `saha` adlı
# YUVARLANAN release'in varlıkları değiştirilir (tek release, çok sürüm ÇÖPÜ yok).
# Uygulamanın saha kanalı açılışta surum.json'a bakar, yenisini görünce kendini günceller.
# Bu yol tünelden ve API'den bağımsızdır — geliştirici makinesi kapalıyken de çalışır.
#
# GEÇİCİ ÖZELLİK: Play Store'a çıkınca bu hat kapanır; `magaza` flavor'ında güncelleme
# kodu ve REQUEST_INSTALL_PACKAGES izni ZATEN yoktur (izin denetimi bunu kilitler).
#
# İmza: `saha` anahtarı (GitHub secrets). Yerel debug imzayla ÇAKIŞMAZ ama üstüne de
# KURULAMAZ — sahadaki cihaza İLK kurulum da bu hattın ürettiği APK'yla yapılmalıdır.
name: saha-apk

on:
  push:
    branches: [dev]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/saha-apk.yml'
  workflow_dispatch: {}

# Üst üste push'ta eski derleme iptal — yalnız en günceli yayınlanır.
concurrency:
  group: saha-apk
  cancel-in-progress: true

permissions:
  contents: write   # release varlıklarını güncelleyebilmek için

jobs:
  # TESTLER DERLEMEDEN ÖNCE — bu iş 2026-08-06'da eklendi ve boşluğu kapatıyor.
  #
  # ÖNCESİNDE: mobil testler YALNIZ yerel `Stop` kancasında koşuyordu ve o kanca zaman aşımına
  # takılıp commit'e bile ulaşamıyordu (ölçüm: pint+phpstan+artisan test = 604sn, timeout 600sn).
  # Yani tek bekçi hem yavaş hem güvenilmezdi; kancadan çıkarılınca mobil tarafta HİÇ test
  # kalmayacaktı ve bu hat bozuk bir APK'yı doğrudan sahadaki telefona yollardı — güncelleme
  # kendiliğinden iniyor, kimse "kurma" demiyor.
  #
  # Bu iş KIRMIZIYSA `derle-ve-yayinla` hiç başlamaz (`needs: test`), yani release varlıkları
  # ellenmez ve telefondaki sürüm olduğu gibi kalır. Testin doğru yeri burası: kimseyi
  # bekletmiyor ve geliştirici makinesi kapalıyken de koşuyor.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'   # derleme işiyle AYNI sürüm; ayrışırsa test yalan söyler
          channel: stable
          cache: true

      - name: Bağımlılıklar
        working-directory: apps/mobile
        run: flutter pub get

      # `dart analyze`, `flutter analyze` DEĞİL: yerel kancada da öyle (Türkçe karakterli yol
      # flutter analyze'in LSP kanalını kırıyordu). Aynı aracı kullanmak, CI ile yerelin aynı
      # şeyi ölçmesini sağlar.
      - name: Analiz
        working-directory: apps/mobile
        run: dart analyze

      - name: Testler
        working-directory: apps/mobile
        run: flutter test

  derle-ve-yayinla:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TAM geçmiş ŞART: versionCode = `git rev-list --count HEAD`
          # (build.gradle.kts bunu üretir; sığ klonda sayı yanlış çıkar).
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'   # yerel geliştirme sürümüyle AYNI tutulur
          channel: stable
          cache: true

      - name: İmza anahtarını aç
        env:
          B64: ${{ secrets.SAHA_KEYSTORE_B64 }}
        run: |
          printf '%s' "$B64" | base64 -d > /tmp/saha.jks
          echo "SAHA_KEYSTORE_YOLU=/tmp/saha.jks" >> "$GITHUB_ENV"

      - name: APK derle (saha flavor, arm64 + evrensel)
        working-directory: apps/mobile
        env:
          SAHA_KEYSTORE_SIFRE: ${{ secrets.SAHA_KEYSTORE_SIFRE }}
          SAHA_ANAHTAR_SIFRE: ${{ secrets.SAHA_ANAHTAR_SIFRE }}
        run: |
          # SIPARIO_YAPIM define'ı ŞART: --split-per-abi versionCode'a ABI sapması ekler
          # (arm64 = 2000 + git sayısı). PackageInfo.buildNumber ile surum.json'daki yapim
          # karşılaştırılsaydı arm64 cihaz kendini hep "güncel" sanır ve BİR DAHA
          # GÜNCELLENMEZDİ. Uygulama kendi yapımını bu define'dan okur, sapmadan bağımsız.
          YAPIM=$(git rev-list --count HEAD)
          flutter pub get
          flutter build apk --release --flavor saha \
            --dart-define=SIPARIO_KANAL=saha --dart-define=SIPARIO_YAPIM="$YAPIM" --split-per-abi
          flutter build apk --release --flavor saha \
            --dart-define=SIPARIO_KANAL=saha --dart-define=SIPARIO_YAPIM="$YAPIM"

      - name: Sürümü APK'nın KENDİSİNDEN doğrula
        run: |
          CIKTI=apps/mobile/build/app/outputs/flutter-apk
          ls -la "$CIKTI"
          # Dosya adları cagri raporuyla sabitlendi: app-<abi>-<flavor>-release.apk
          ARM="$CIKTI/app-arm64-v8a-saha-release.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          # --split-per-abi ABI sapması ekler: arm64 versionCode = 2000 + git sayısı.
          # Sapma Flutter gradle eklentisinin içinde ve geri alınamıyor (denendi, ezildi).
          BEKLENEN=$(( 2000 + $(git rev-list --count HEAD) ))
          OKUNAN=$("$AAPT" dump badging "$ARM" | grep -oP "versionCode='\K[0-9]+")
          echo "beklenen=$BEKLENEN okunan=$OKUNAN"
          test "$BEKLENEN" = "$OKUNAN"   # gradle'ın yazdığına güvenme — APK'dan oku
          # saha APK'sında kurulum izni OLMALI (güncelleme bununla çalışıyor):
          "$AAPT" dump badging "$ARM" | grep -q REQUEST_INSTALL_PACKAGES

      - name: surum.json üret ve saha release'ini güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CIKTI=apps/mobile/build/app/outputs/flutter-apk
          # Dosya adları cagri raporuyla sabitlendi.
          ARM="$CIKTI/app-arm64-v8a-saha-release.apk"
          FAT="$CIKTI/app-saha-release.apk"
          # Varlık adları SABİTLENİR — surum.json'daki indirme adresleri bu adlara bakar;
          # flutter çıktı adı değişse bile uygulama tarafı etkilenmez.
          cp "$ARM" saha-arm64.apk
          cp "$FAT" saha-evrensel.apk
          YAPIM=$(git rev-list --count HEAD)
          SURUM=$(grep -m1 '^version:' apps/mobile/pubspec.yaml | sed 's/version: *//; s/+.*//' | tr -d ' ')
          DEPO="${{ github.repository }}"
          # boyut alanları: indirme bütünlüğü kontrolü — yarım inen APK kurulmaya çalışılmaz.
          cat > surum.json <<JSON
          {
            "yapim": $YAPIM,
            "surum": "$SURUM",
            "apk_arm64": "https://github.com/$DEPO/releases/download/saha/saha-arm64.apk",
            "apk_evrensel": "https://github.com/$DEPO/releases/download/saha/saha-evrensel.apk",
            "boyut_arm64": $(stat -c%s saha-arm64.apk),
            "boyut_evrensel": $(stat -c%s saha-evrensel.apk)
          }
          JSON
          cat surum.json
          # Yuvarlanan release: yoksa bir kez yaratılır, sonra yalnız varlıkları değişir.
          gh release view saha >/dev/null 2>&1 || gh release create saha --prerelease \
            --title "Saha sürümü (otomatik)" \
            --notes "Bu release CI tarafından her dev push'unda güncellenir. Uygulamanın saha kanalı surum.json üzerinden kendini günceller."
          gh release upload saha saha-arm64.apk saha-evrensel.apk surum.json --clobber
          echo "Yayınlandı: $SURUM ($YAPIM)"
