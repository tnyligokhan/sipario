name: API CI

# GEÇERSİZ KALMIŞ KOŞUMU İPTAL ET (2026-09-01'de ÖLÇÜLDÜ, varsayılmadı).
#
# Bu depoda otomatik commit kancası çalışıyor ve `dev`e arka arkaya push atılıyor. Ölçüm:
# 31 Ağustos 18:46 ve 18:47'de iki API CI koşumu başladı, İKİSİ DE sonuna kadar koştu
# (182 sn + 189 sn) — oysa ilki bittiğinde zaten geçersizdi. Aynı ikili 22:02, 21:55 ve
# 28 Ağustos 00:19'da da tekrarlıyor: ~184 sn'lik takım boşuna dönüyor.
#
# `mobil-apk.yml` bu bloğu zaten taşıyor ve işe yaradığı aynı tabloda görünüyor: 11:28'deki
# koşum 854 sn yerine 130 sn'de `cancelled` oldu.
#
# ⚠️ Dal başına AYRI kuyruk: `main` koşumu `dev` koşumunu iptal ETMEMELİ — sahaya çıkan bir
# doğrulama, ekip dev'e push attı diye yarıda kesilemez.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # Dal süzgeci: geçici/deneme dallarına atılan push tam takımı koşturmasın. PR açılınca
    # `pull_request` zaten koşar, yani kapsam daralmıyor.
    branches: [main, dev]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
      - 'docker/postgres/**'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
      - 'docker/postgres/**'

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sipario_test
          POSTGRES_USER: sipario_owner
          POSTGRES_PASSWORD: ci_owner
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=tr-TR --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sipario_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sipario_test
      # RUNTIME + test bağlantısı: superuser/BYPASSRLS DEĞİL → RLS uygulanır (izolasyon gerçekten sınanır).
      DB_USERNAME: sipario_app
      DB_PASSWORD: ci_app
      # Migration/policy oluşturma bağlantısı (owner).
      DB_OWNER_USERNAME: sipario_owner
      DB_OWNER_PASSWORD: ci_owner

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3 + pgsql
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql
          coverage: none

      # Roller local 10-roles.sh ile aynı mantık; init betiği CI'da koşmadığı için elle kuruyoruz.
      # sipario_app: RLS'e tabi runtime rolü. sipario_auth: SECURITY DEFINER login fonksiyonunun sahibi.
      # sipario_panel (Faz 5c): yönetim paneli rolü — BYPASSRLS (cross-tenant OKUR), iş verisine yazamaz
      # (grant matrisi migration 504'te). Şifre phpunit.xml'deki DB_PANEL_PASSWORD ile eşleşir.
      - name: Postgres rollerini kur
        env:
          PGPASSWORD: ci_owner
        run: |
          psql -h 127.0.0.1 -U sipario_owner -d sipario_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE sipario_app LOGIN PASSWORD 'ci_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;" \
            -c "CREATE ROLE sipario_auth NOLOGIN NOSUPERUSER BYPASSRLS;" \
            -c "CREATE ROLE sipario_panel LOGIN PASSWORD 'sipario_panel_dev' NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;" \
            -c "GRANT CONNECT ON DATABASE sipario_test TO sipario_app;" \
            -c "GRANT USAGE ON SCHEMA public TO sipario_app;" \
            -c "GRANT CONNECT ON DATABASE sipario_test TO sipario_panel;" \
            -c "GRANT USAGE ON SCHEMA public TO sipario_panel;"

      # Composer indirme önbelleği: paketler her koşumda sıfırdan çekiliyordu. Anahtar
      # composer.lock'a bağlı — kilit değişirse önbellek kendiliğinden tazelenir.
      - name: Composer önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php83-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php83-

      - name: Composer bağımlılıkları
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Uygulama anahtarı
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Kod stili (pint)
        run: vendor/bin/pint --test

      # Migration owner ile (tablo + RLS policy oluşturur); testler app rolüyle koşar.
      - name: Migrationlar (owner)
        run: php artisan migrate --database=pgsql_owner --force

      # Kırmızı çizgi #1: izolasyon test matrisi burada koşar. Yeni bir tenant-scope endpoint
      # izolasyon testi almadan eklendiyse bu adım kırılmalıdır (TenantIsolationTest).
      - name: Testler
        run: php artisan test
