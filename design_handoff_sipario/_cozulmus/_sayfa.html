<style>
/* ═══════ SİPARİO 3.0 — YENİ KİMLİK ═══════
   Koyu gece-mürekkep hero · aydınlık gövde · elektrik moru vurgu
   Sora (rakam & başlık) · Hanken Grotesk (metin)
   Flat bento yüzeyler — gölge yok, ton farkıyla katman */
:root {
  --canvas: #DDDCE4;
  --bg: #F4F3F7;
  --surface: #FFFFFF;
  --surface-2: #EAE8F0;
  --ink: #17141F;
  --ink-2: #47434F;
  --muted: #8B8794;
  --line: #E6E4EC;
  --line-2: #D2CFDB;
  --accent: #5A45F0;
  --accent-ink: #FFFFFF;
  --accent-soft: #ECE9FE;
  --hero: #17141F;
  --hero-2: #241F31;
  --danger: #DF3F45;
  --danger-soft: #FCE9EA;
  --ok: #1E9E6A;
  --ok-soft: #E3F4EC;
  --warn: #C08415;
  --warn-soft: #F9F0DC;
  --font-d: 'Sora', system-ui, sans-serif;
  --font-b: 'Hanken Grotesk', system-ui, sans-serif;
  --r1: 12px; --r2: 16px; --r3: 22px; --r4: 30px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--font-b); background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; }
.tabular { font-variant-numeric: tabular-nums; }
a { color: var(--accent); } a:hover { color: #4433C4; }
button { font-family: inherit; color: inherit; }

#root { width: 412px; height: 892px; max-height: 100vh; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(23,20,31,.45); }
@media (min-width: 480px) { #root { border-radius: 46px; height: 860px; } }

.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
.app-icerik { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding-top: 36px; }
/* ── Sistem çubukları ── */
.sysbar { position: absolute; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 2px 24px 0 28px; z-index: 120; pointer-events: none; color: var(--ink); font-family: var(--font-d); font-weight: 700; font-size: 13px; }
.sysbar.byz, .app.koyu .sysbar { color: #fff; }
.sysbar-sag { display: inline-flex; align-items: center; gap: 5px; }
.homeind { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 128px; height: 5px; border-radius: 999px; background: rgba(0,0,0,.25); z-index: 120; pointer-events: none; }
.homeind.byz, .app.koyu .homeind { background: rgba(255,255,255,.4); }
.ekran { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ekran-govde { flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 20px; -webkit-overflow-scrolling: touch; }

/* ── ANA: koyu hero ── */
.ana-hero { flex-shrink: 0; background: var(--hero); color: #fff; padding: 26px 22px 24px; border-radius: 0 0 var(--r4) var(--r4); }
.ana-hero-ust { display: flex; align-items: flex-start; }
.ana-selam { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.55); }
.ana-isletme { font-family: var(--font-d); font-weight: 700; font-size: 24px; letter-spacing: -.02em; margin-top: 3px; }
.ana-menu { margin-left: auto; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ana-menu:active { background: rgba(255,255,255,.14); }
.ana-sync { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,.6); margin-top: 16px; background: rgba(255,255,255,.07); padding: 6px 12px; border-radius: 999px; }
.ana-sync i { width: 7px; height: 7px; border-radius: 999px; background: #3DDC97; }
.ana-govde { padding-top: 16px; }

/* Bento */
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bento-k { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; padding: 16px; min-height: 108px; border: none; border-radius: var(--r3); background: var(--surface); cursor: pointer; }
.bento-k:active { background: var(--surface-2); }
.bento-k.birincil { background: var(--accent); color: var(--accent-ink); }
.bento-k.birincil:active { filter: brightness(.94); }
.bento-l { font-size: 12px; font-weight: 600; opacity: .72; line-height: 1.25; }
.bento-v { font-family: var(--font-d); font-weight: 800; font-size: 40px; letter-spacing: -.03em; line-height: 1; margin-top: auto; }
.bento-v.kucuk { font-size: 19px; font-weight: 700; }
.bento-v.eksi { color: var(--danger); }
.bento-alt { font-size: 11px; font-weight: 500; opacity: .6; }
.bento-ikon { width: 38px; height: 38px; border-radius: 999px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }

/* Ana CTA */
.ana-cta { width: 100%; display: flex; align-items: center; gap: 13px; margin-top: 12px; padding: 15px 16px; border: none; border-radius: var(--r3); background: var(--hero); color: #fff; cursor: pointer; }
.ana-cta:active { background: var(--hero-2); }
.ana-cta-ic { width: 38px; height: 38px; border-radius: 999px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ana-cta-t { flex: 1; text-align: left; font-weight: 700; font-size: 15.5px; }
.ana-baslik { font-family: var(--font-d); font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; margin: 20px 2px 8px; }
.ana-bos { font-size: 13px; color: var(--muted); padding: 8px 2px; }
.akt-list { display: flex; flex-direction: column; gap: 6px; }
.akt-row { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border: none; border-radius: var(--r2); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.akt-row:active { background: var(--surface-2); }
.akt-ic { width: 30px; height: 30px; border-radius: 999px; background: var(--ok-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.akt-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.akt-t { font-weight: 700; font-size: 13.5px; }
.akt-s { font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.akt-amt { font-family: var(--font-d); font-weight: 700; font-size: 13px; }

/* ── Üst başlık (iç sayfalar) ── */
.ust { min-height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 12px 18px 8px; }
.ust-ikon { width: 38px; height: 38px; border: none; background: var(--surface); border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.ust-ikon:active { background: var(--surface-2); }
.ust-mid { flex: 1; min-width: 0; }
.ust-title { font-family: var(--font-d); font-weight: 700; font-size: 19px; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ust-sub { font-size: 11.5px; font-weight: 500; color: var(--muted); margin-top: 1px; }
.ust-sag { display: flex; align-items: center; gap: 6px; }
.ust-metin { border: none; background: var(--surface); color: var(--accent); font-weight: 700; font-size: 12.5px; padding: 8px 13px; border-radius: 999px; cursor: pointer; }
.ust-sirala { display: inline-flex; align-items: center; gap: 6px; border: none; background: var(--surface); color: var(--accent); font-weight: 700; font-size: 12.5px; padding: 9px 14px; border-radius: 999px; cursor: pointer; }
.ust-sirala:active { background: var(--surface-2); }
.elle-bant { display: flex; align-items: center; gap: 7px; margin: 0 18px 10px; padding: 9px 13px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }
.srow.elle { cursor: default; }
.srow.dragging { background: var(--accent-soft); border-radius: 14px; box-shadow: 0 10px 26px -12px rgba(23,20,31,.4); position: relative; z-index: 5; }
.srow-grip { width: 34px; height: 34px; margin-right: 2px; border-radius: 999px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: grab; touch-action: none; }
.srow.dragging .srow-grip { cursor: grabbing; background: var(--surface); }

/* ── Alt nav ── */
.altnav { flex-shrink: 0; position: relative; display: flex; align-items: center; gap: 6px; background: var(--hero); margin: 10px 16px calc(22px + env(safe-area-inset-bottom)); padding: 6px; border-radius: 999px; }
.altnav-grup { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.altnav-b { flex: 1; min-width: 0; height: 50px; border: none; background: none; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; border-radius: 999px; transition: flex .26s cubic-bezier(.2,.8,.2,1), background .2s; }
.altnav-b span { font-size: 12.5px; font-weight: 700; color: #fff; display: none; white-space: nowrap; }
.altnav-b.on { flex: 2; background: rgba(255,255,255,.12); }
.altnav-b.on span { display: inline; }
.altnav-fab { width: 50px; height: 50px; border-radius: 999px; background: var(--accent); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform .22s; }
.altnav-fab.on { transform: rotate(45deg); }
.fabpop-scrim { position: fixed; inset: 0; z-index: 44; }
.fabpop { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 12px); z-index: 45; background: var(--surface); border-radius: 18px; padding: 7px; display: flex; flex-direction: column; gap: 2px; min-width: 200px; box-shadow: 0 18px 44px -12px rgba(15,17,26,.35); animation: fabpopIn .2s cubic-bezier(.2,.8,.2,1); }
.fabpop::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%) rotate(45deg); bottom: -6px; width: 13px; height: 13px; background: var(--surface); border-radius: 3px; }
@keyframes fabpopIn { from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.95); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
.fabpop-b { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border: none; border-radius: 12px; background: none; cursor: pointer; text-align: left; }
.fabpop-b:active { background: var(--surface-2); }
.fabpop-ic { width: 36px; height: 36px; border-radius: 999px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.fabpop-lbl { font-weight: 700; font-size: 14px; }
.altnav-fab:active { transform: scale(.94); }

/* ── Butonlar ── */
.btn { height: 48px; flex: 0 0 auto; width: 100%; border-radius: var(--r2); font-size: 14.5px; font-weight: 700; border: none; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; transition: filter .12s, transform .06s; }
.btn:active { transform: scale(.98); }
.btn-p { background: var(--accent); color: var(--accent-ink); }
.btn-p:active { filter: brightness(.92); }
.btn-p:disabled { background: var(--line-2); color: #fff; cursor: default; }
.btn-s { background: var(--surface-2); color: var(--ink); }
.btn-d { background: var(--danger); color: #fff; }
.pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }

/* ── Arama & segment ── */
.arama { margin: 4px 18px 12px; display: flex; align-items: center; gap: 9px; background: var(--surface); border-radius: 999px; padding: 0 16px; height: 46px; }
.arama input { flex: 1; border: none; background: none; font-family: inherit; font-size: 14.5px; color: var(--ink); outline: none; }
.arama input::placeholder { color: var(--muted); }
.arama-x { border: none; background: none; cursor: pointer; padding: 4px; display: flex; }
.segtab { display: flex; gap: 4px; margin: 0 18px 12px; background: var(--surface-2); border-radius: 999px; padding: 4px; }
.segtab-b { flex: 1; height: 34px; border: none; background: none; color: var(--muted); font-weight: 600; font-size: 12.5px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
.segtab-b.on { background: var(--hero); color: #fff; font-weight: 700; }

/* ── Listeler: flat ton kartları ── */
.mliste, .sliste, .uliste { display: flex; flex-direction: column; gap: 7px; padding-top: 2px; }
.mrow { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: none; border-radius: var(--r2); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.mrow:active { background: var(--surface-2); }
.mrow-av { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--font-d); font-weight: 700; font-size: 13px; flex-shrink: 0; }
.mrow-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mrow-nm { font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow-tel { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.mrow-adres { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; font-weight: 700; line-height: 1.4; color: var(--ink-2); }
.mrow-tel svg, .mrow-adres svg { flex-shrink: 0; margin-top: 1px; }
.mrow-bal { align-self: center; flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; background: color-mix(in srgb, currentColor 8%, transparent); }
.mrow-dot { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; }
.mrow-amt { font-family: var(--font-d); font-weight: 700; font-size: 12.5px; white-space: nowrap; }

/* ── Müşteri detayı ── */
.md-kart { background: var(--hero); color: #fff; border-radius: var(--r3); padding: 18px; margin-top: 4px; }
.md-kart-adres { display: flex; gap: 9px; align-items: flex-start; font-size: 14.5px; font-weight: 600; line-height: 1.45; }
.md-kart-adres svg { flex-shrink: 0; margin-top: 2px; }
.md-kart-tel { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.55); margin: 8px 0 0 26px; }
.md-ilet { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
.md-ilet button { display: flex; align-items: center; justify-content: center; gap: 6px; height: 42px; border: none; border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; font-family: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer; }
.md-ilet button:active { background: rgba(255,255,255,.2); }
.md-bakiye { display: flex; align-items: center; gap: 9px; margin-top: 10px; padding: 11px 14px; border-radius: var(--r2); }
.md-bakiye > span:first-child { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.md-bakiye b { font-family: var(--font-d); font-weight: 700; font-size: 14px; }
.md-bakiye-kupon { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; }
.md-bal { background: var(--hero); color: #fff; border-radius: var(--r3); padding: 22px 18px 18px; text-align: center; margin-top: 4px; }
.md-bal-l { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .08em; }
.md-bal-v { font-family: var(--font-d); font-weight: 800; font-size: 34px; letter-spacing: -.03em; margin-top: 5px; }
.md-bal-t { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-top: 2px; }
.md-kupon { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.75); margin-top: 12px; background: rgba(255,255,255,.09); padding: 6px 12px; border-radius: 999px; }
.md-kupon.eksi { background: rgba(223,63,69,.25); color: #FFB3B5; }
.md-kupon b { font-family: var(--font-d); }
.md-akslar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.mdakt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border: none; border-radius: var(--r2); background: var(--surface); cursor: pointer; }
.mdakt span { font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
.mdakt:active { background: var(--surface-2); }
.md-not { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--ink-2); background: var(--warn-soft); border-radius: var(--r2); padding: 12px 14px; margin-top: 12px; }
.md-not svg { flex-shrink: 0; margin-top: 1px; }
.md-adres { display: flex; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-top: 12px; padding: 0 4px; }
.md-baslik { font-family: var(--font-d); font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; margin: 20px 2px 8px; }

/* Defter */
.defter { display: flex; flex-direction: column; gap: 6px; }
.dhar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r2); background: var(--surface); }
.dhar-ic { width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.dhar-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dhar-t { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
.dhar-odeme { font-size: 9.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; background: var(--surface-2); padding: 2px 7px; border-radius: 999px; }
.dhar-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.dhar-amt { font-family: var(--font-d); font-weight: 700; font-size: 13.5px; flex-shrink: 0; }

/* ── Sipariş listesi ── */
.srow { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 13px 15px; border: none; border-radius: var(--r2); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.srow:active { background: var(--surface-2); }
.srow-ust { display: flex; align-items: center; gap: 8px; }
.srow-kod { flex-shrink: 0; font-family: var(--font-d); font-weight: 700; font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 3px 7px; border-radius: 7px; }
.srow-nm { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow-saat { flex-shrink: 0; margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.srow-urunler { display: flex; flex-direction: column; align-items: stretch; gap: 3px; min-width: 0; font-size: 12.5px; font-weight: 500; color: var(--ink-2); padding: 0 2px; }
.srow-uhead { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 2px; }
.srow-uhead span { color: var(--muted); }
.srow-uitem { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow-uitem i { width: 5px; height: 5px; border-radius: 99px; background: var(--line-2); flex-shrink: 0; }
.srow-meta2 { display: none; }
.srow-head { display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.srow-alt { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.srow-kurye { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
.srow-kurye:active { background: var(--line); }
.srow-odeme { font-weight: 700; color: var(--muted); }
.srow-not { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; line-height: 1.45; color: var(--ink-2); background: var(--warn-soft); border-radius: 10px; padding: 8px 11px; }
.srow-not svg { flex-shrink: 0; margin-top: 1px; }
.srow-not b { font-weight: 800; color: var(--warn); }
/* ── Ayarlar ── */
.ayar-kart { background: var(--surface); border-radius: var(--r3); padding: 4px 8px; }
.ayar-row { display: flex; align-items: center; gap: 12px; padding: 13px 8px; border: none; border-bottom: 1px solid var(--line); background: none; cursor: pointer; text-align: left; width: 100%; font-family: inherit; }
.ayar-row:last-child { border-bottom: none; }
.ayar-row:active { background: var(--surface-2); }
.ayar-row.salt { cursor: default; }
.ayar-row.salt:active { background: none; }
.ayar-row .cek-lbl { display: flex; flex-direction: column; gap: 2px; color: var(--ink); font-weight: 700; }
.ayar-row .cek-ic { background: var(--accent-soft); }
.ayar-row .cek-ic svg { stroke: var(--accent); }
.ayar-alt { font-size: 11.5px; font-weight: 500; color: var(--muted); }
.ayar-row .aktif-knob { margin-left: auto; }
.ayar-row .aktif-knob[data-on="true"] { background: var(--accent); }
.ayar-row .aktif-knob[data-on="true"]::after { transform: translateX(16px); }
.srow-adres { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; font-weight: 700; line-height: 1.4; color: var(--ink); border: 1.5px solid var(--line-2); border-radius: 10px; padding: 9px 11px; }
.srow-adres svg { flex-shrink: 0; margin-top: 1px; }
.srow-adres > span:first-of-type { flex: 1; min-width: 0; }
.srow-amt { font-family: var(--font-d); font-weight: 700; font-size: 14px; flex-shrink: 0; }
.srow-acts { display: flex; gap: 7px; margin-top: 2px; }
.srow-acts button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 38px; border: none; border-radius: 999px; background: var(--surface-2); font-family: inherit; font-weight: 700; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.srow-acts button:active { background: var(--line-2); }
.sr-list { display: flex; flex-direction: column; gap: 6px; }
.sr-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; border: none; border-radius: var(--r2); background: var(--bg); font-family: inherit; font-weight: 600; font-size: 13.5px; color: var(--ink-2); cursor: pointer; text-align: left; }
.sr-row.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.sr-oto { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; padding: 13px; border: none; border-radius: var(--r2); background: var(--accent); color: var(--accent-ink); font-family: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; }

/* ── Yeni sipariş ── */
.ys-ekle { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border: 1.5px dashed var(--line-2); border-radius: var(--r2); background: none; color: var(--accent); font-weight: 700; font-size: 13.5px; cursor: pointer; margin-top: 6px; }
.ys-ekle:active { background: var(--accent-soft); }
.ys-bos { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 30px; color: var(--muted); font-size: 13px; font-weight: 500; text-align: center; }
.ys-liste { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
.ys-satir { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: var(--r2); background: var(--surface); }
.ys-satir-nm { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; display: flex; flex-direction: column; }
.ys-birim { font-size: 10.5px; color: var(--muted); font-weight: 500; margin-top: 1px; }
.ys-stepper { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.ys-stepper button { width: 28px; height: 28px; border-radius: 999px; border: none; background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ys-stepper span { min-width: 16px; text-align: center; font-weight: 700; font-size: 13.5px; }
.ys-sil { width: 30px; height: 30px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.ys-satir-tt { font-family: var(--font-d); font-weight: 700; font-size: 13px; min-width: 66px; text-align: right; }
.ys-serbest { width: 100%; text-align: center; border: none; background: none; color: var(--muted); font-weight: 600; font-size: 12.5px; padding: 13px 2px; cursor: pointer; }
.ys-serbest:active { color: var(--accent); }
.ys-alt { flex-shrink: 0; margin: 10px 16px calc(22px + env(safe-area-inset-bottom)); padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r3); box-shadow: 0 16px 34px -20px rgba(23,20,31,.4); display: flex; gap: 10px; align-items: center; }
.ys-toplam { flex: 1; display: flex; flex-direction: column; }
.ys-toplam span { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ys-toplam b { font-family: var(--font-d); font-weight: 800; font-size: 21px; letter-spacing: -.02em; }
.ys-alt .btn { flex: 0 0 auto; width: auto; padding: 0 24px; }
.sd-alt .btn { flex: 1 1 0; width: auto; }

/* Katalog / form */
.katalog { display: flex; flex-direction: column; gap: 6px; }
.kat-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: none; border-radius: var(--r2); background: var(--bg); cursor: pointer; text-align: left; width: 100%; }
.kat-row:active { background: var(--surface-2); }
.kat-mid { flex: 1; display: flex; flex-direction: column; }
.kat-nm { font-weight: 700; font-size: 13.5px; }
.kat-birim { font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 1px; }
.kat-fiyat { font-family: var(--font-d); font-weight: 700; font-size: 13px; }
.sb-form { display: flex; flex-direction: column; }
.s-flabel { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 14px 0 6px; }
.s-input { height: 46px; border: 1.5px solid transparent; border-radius: var(--r2); background: var(--surface-2); font-family: inherit; font-size: 15px; color: var(--ink); padding: 0 14px; outline: none; width: 100%; transition: border-color .12s, background .12s; }

.cagri-kart { width: 100%; background: var(--surface); border-radius: var(--r3); padding: 18px 18px 20px; box-shadow: 0 30px 70px -20px rgba(23,20,31,.55); animation: cUp .28s cubic-bezier(.2,.8,.2,1); }
