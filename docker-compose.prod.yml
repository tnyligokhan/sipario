# ══════════════════════════════════════════════════════════════════════════════
#  Sipario — ÜRETİM Docker Compose
# ══════════════════════════════════════════════════════════════════════════════
#
#  Bu dosya YALNIZ üretim (Coolify) içindir.
#  Geliştirme ortamı docker-compose.yml ile çalışmaya devam eder — o dosyaya
#  dokunulmaz.
#
#  COOLIFY DAVRANIȘI:
#    - Coolify bu dosyayı okur ve `app` servisine Traefik label'ları ekler
#    - Domain yapılandırması Coolify UI'dan yapılır (compose'da yok)
#    - Environment variables Coolify UI'dan girilir ve ${VAR} ile çözümlenir
#    - TLS: Coolify Traefik otomatik Let's Encrypt alır
#
#  SERVİSLER:
#    app       — Laravel (API + pazarlama sitesi + yönetim paneli)
#    queue     — php artisan queue:work (aynı imaj, farklı giriş noktası)
#    scheduler — php artisan schedule:work
#    db        — PostgreSQL 16 + ICU tr-TR + 3 rol init betiği
#    backup    — Günlük pg_dump sidecar (7/4/6 saklama)
#
#  PORT GÜVENLİĞİ:
#    db servisi port DIȘARIYA AÇILMAZ. Dev compose'daki 55432 port yalnız
#    yerel geliştirici kolaylığıydı; üretimde DB'ye yalnız aynı Docker
#    ağındaki container'lar erişir.
# ══════════════════════════════════════════════════════════════════════════════

# ── Paylaşılan uygulama ortam değişkenleri (YAML anchor) ────────────────────
# app, queue ve scheduler aynı Laravel uygulamasıdır; üçü de aynı env
# değişkenlerine ihtiyaç duyar. Tekrarı önlemek için anchor kullanılır.
x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Sipario}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-base64:Wi45ki1vmGrHW3XQUjFSQbkyNj0I/gGiyxlHlIpg5Wk=}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-https://sipario.com.tr}
  APP_LOCALE: tr
  APP_FALLBACK_LOCALE: tr
  APP_FAKER_LOCALE: tr_TR
  # Günlükleme — VARSAYILAN `stderr`, `stack`/`single` DEĞİL (2026-08-09, ölçümle değiştirildi).
  #
  # ARIZA: uygulama 2026-08-09 17:01'de çöktü, 16 kez yeniden başlatıldı (`last_restart_type:
  # crash`), Coolify'ın `max_restart_count: 10` tavanını aşınca yeniden başlatmayı BIRAKTI ve site
  # elle redeploy edilene kadar 503 kaldı. Çöküşün sebebi ARANAMADI çünkü kanıt yoktu.
  #
  # KANIT NEDEN YOKTU: `stack`→`single` kanalı günlükleri container İÇİNDEKİ
  # `storage/logs/laravel.log` dosyasına yazıyordu ve bu servisin o dizin için volume'ü YOK
  # (aşağıda yalnız `pgdata` ve `backups` var). Container her yeniden yaratıldığında bütün
  # uygulama günlükleri siliniyordu. Coolify'ın log ekranı ise container'ın STDOUT'unu gösterir —
  # Laravel oraya hiçbir şey yazmadığı için ekranda yalnız `scheduler`ın "No scheduled commands"
  # gürültüsü görünüyordu. Yani sistem kendi arızasının kaydını TASARIM GEREĞİ tutmuyordu.
  #
  # `stderr` bunu tersine çevirir: günlük Docker'a akar, `docker logs` ile okunur, Coolify'ın
  # kendi ekranında görünür ve container ölse bile Docker'ın o container için tuttuğu kayıt
  # kalır. Dosyaya yazmadığı için `storage/logs` izin sorunu da doğmaz.
  #
  # ⚠️ VOLUME BİLİNÇLİ OLARAK EKLENMEDİ: `storage/logs`a adlandırılmış bir volume bağlamak
  # cazip görünüyor ama volume root sahipliğinde doğar, uygulama ise `www-data` olarak koşar
  # (`docker/php/Dockerfile:76`) — yazamayan bir log dizini, düzeltmeye çalıştığımız çöküşün
  # yenisini üretebilirdi. Kalıcı arşiv gerekirse doğru yol Docker günlük sürücüsü ya da harici
  # bir toplayıcıdır, canlıda körlemesine bağlanan bir volume değil.
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Veritabanı — runtime rolü (sipario_app, RLS altında)
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-sipario}
  DB_USERNAME: ${DB_USERNAME:-sipario_app}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  # Veritabanı — sahip rolü (migration/deploy)
  DB_OWNER_USERNAME: ${DB_OWNER_USERNAME:-sipario_owner}
  DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
  # Veritabanı — panel rolü (cross-tenant okuma)
  DB_PANEL_USERNAME: ${DB_PANEL_USERNAME:-sipario_panel}
  DB_PANEL_PASSWORD: ${DB_PANEL_PASSWORD}
  # Önbellek, kuyruk, oturum
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  # Posta
  #
  # ⚠️ BURADA OLMAYAN BİR ANAHTAR, PANELE YAZILSA BİLE CONTAINER'A GİTMEZ. Coolify'ın env
  # değişkenleri bu dosyadaki `${...}` yerlerine DEĞER BASAR; hiçbir yerde geçmeyen bir anahtar
  # yalnız panelde durur. ("Dosyada ne yazıyor" ile "container'a ne gidiyor" ayrı sorulardır —
  # DECISIONS 2026-08-10/2'de bir kez ödendi.)
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  #
  # `MAIL_ENCRYPTION` KALDIRILDI — ÖLÜ BİR DÜĞMEYDİ (2026-08-11, vendor kaynağından doğrulandı).
  # Laravel'in bu sürümünde `MailManager::createSmtpTransport` şemayı YALNIZ PORTTAN türetiyor:
  #     $scheme = $config['scheme'] ?? null;
  #     if (! $scheme) { $scheme = ($config['port'] == 465) ? 'smtps' : 'smtp'; }
  # ve `config/mail.php`in smtp bloğunda `encryption` diye bir anahtar HİÇ YOK. Yani panele
  # `MAIL_ENCRYPTION=ssl` yazan biri, hiçbir şey yapmayan bir düğmeyi çevirmiş olur — üstelik
  # yapılandırmayı TAMAMLANMIŞ sanır. Bu, arızadan daha kötüdür: yanlış bir "ayarlandı" hissi.
  #
  # Yerine GERÇEKTEN OKUNAN anahtar geçiriliyor. Boş bırakılırsa davranış bugünküyle aynı
  # (port 465 → `smtps` örtük TLS, diğer portlar → `smtp` + STARTTLS). Yalnız sağlayıcı
  # standart dışı bir port üzerinde örtük TLS istiyorsa `smtps` diye elle yazılır.
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  #
  # Tek satırlık DSN (`smtp://kullanici:parola@host:587`). Verilirse host/port/kullanıcı/parolayı
  # EZER — bazı sağlayıcılar panelde bunu tek parça veriyor ve dört alana bölmek hata kaynağı.
  MAIL_URL: ${MAIL_URL:-}
  #
  # SMTP `EHLO` adı. Verilmezse `APP_URL`in host'una düşer (Laravel varsayılanı). Bazı sağlayıcılar
  # EHLO adı çözülemeyen istemciyi reddeder — o hâlde alan adı elle yazılır.
  MAIL_EHLO_DOMAIN: ${MAIL_EHLO_DOMAIN:-}
  #
  # ⚠️ SAĞLAYICILARIN EN SIK REDDETME SEBEBİ: gönderen adres, kimlik doğrulanan hesapla
  # UYUŞMUYOR. Varsayılan `noreply@sipario.com.tr`dir; SMTP hesabı başka bir adresse
  # (Gmail/Yandex/Zoho kutusu gibi) bu değer o adrese ÇEKİLMELİ, yoksa sunucu 550/553 döner.
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@sipario.com.tr}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sipario}

  # ── Yedek bildirimi (2026-08-15) ───────────────────────────────────────────
  # Günlük yedeğin indirme bağlantısı bu adrese gider. BOŞ BIRAKILIRSA komut gönderim
  # yapmaz ve HATA ile çıkar — sessizce "başarılı" dönmez (bkz. YedekBaglantisiGonder).
  # Panelde tanımlanması ZORUNLUDUR; buradaki boş varsayılan yalnız "tanımsız" hâlini
  # anlamlı kılmak içindir.
  YEDEK_EPOSTA: ${YEDEK_EPOSTA:-}
  YEDEK_DIZIN: ${YEDEK_DIZIN:-/backups}
  YEDEK_TAZELIK_SAAT: ${YEDEK_TAZELIK_SAAT:-30}
  # Push bildirimi (FCM)
  #
  # Firebase hizmet hesabı JSON'unun BASE64 hâli. Boş bırakılırsa push sistemi KAPALIDIR ve bu
  # bir hata değildir (`config/push.php`): dürtü bu üründe bir HIZLANDIRICIDIR, taşıyıcı değil —
  # veri mevcut senkronla akmaya devam eder.
  #
  # NEDEN BASE64: dosya çok satırlıdır ve `private_key` alanı gömülü `\n` taşır; panelin env
  # kutusuna ham hâlini yapıştırmak satır sonlarını bozar ve imza SESSİZCE geçersizleşir
  # (FCM "invalid_grant" der, sebebi görünmez).
  #
  # ⚠️ KUYRUK KONTEYNERİNE DE GİDER ve gitmesi ŞARTTIR: gönderim `queue:work` içinde koşar
  # (`App\Jobs\PushGonderimi`). Bu anchor (`*app-env`) hem `app` hem `queue` tarafından
  # kullanıldığı için tek yerde tanımlamak yeterli.
  FCM_HIZMET_HESABI: ${FCM_HIZMET_HESABI:-}
  # Coğrafi kodlama
  GEOCODING_DRIVER: ${GEOCODING_DRIVER:-null}
  GOOGLE_GEOCODER_KEY: ${GOOGLE_GEOCODER_KEY:-}
  GOOGLE_GEOCODER_URL: ${GOOGLE_GEOCODER_URL:-https://maps.googleapis.com/maps/api/geocode/json}
  YANDEX_GEOCODER_KEY: ${YANDEX_GEOCODER_KEY:-}
  YANDEX_GEOCODER_URL: ${YANDEX_GEOCODER_URL:-https://geocode-maps.yandex.ru/v1/}
  YANDEX_DAILY_LIMIT: ${YANDEX_DAILY_LIMIT:-900}
  GEOCODING_DAILY_LIMIT: ${GEOCODING_DAILY_LIMIT:-300}
  GEOCODING_CACHE_DAYS: ${GEOCODING_CACHE_DAYS:-30}
  GEOCODING_MAX_RESULTS: ${GEOCODING_MAX_RESULTS:-5}
  GEOCODING_TIMEOUT: ${GEOCODING_TIMEOUT:-8}
  GEOCODING_COUNTRY: ${GEOCODING_COUNTRY:-tr}
  GEOCODING_LANG: ${GEOCODING_LANG:-tr_TR}
  GEOCODING_BBOX: ${GEOCODING_BBOX:-25.5,35.8~45.0,42.2}
  # Oto sıralama
  ROTA_SURUCU: ${ROTA_SURUCU:-yakin-komsu}
  GOOGLE_ROUTES_KEY: ${GOOGLE_ROUTES_KEY:-}
  GOOGLE_ROUTES_URL: ${GOOGLE_ROUTES_URL:-https://routes.googleapis.com/directions/v2:computeRoutes}
  ROTA_TIMEOUT: ${ROTA_TIMEOUT:-8}
  # Abonelik & ödeme
  SUBSCRIPTION_PRICE_KURUS: ${SUBSCRIPTION_PRICE_KURUS:-120000}
  SUBSCRIPTION_CURRENCY: ${SUBSCRIPTION_CURRENCY:-TRY}
  SUBSCRIPTION_PERIOD_DAYS: ${SUBSCRIPTION_PERIOD_DAYS:-365}
  SUBSCRIPTION_TRIAL_DAYS: ${SUBSCRIPTION_TRIAL_DAYS:-30}
  IYZICO_API_KEY: ${IYZICO_API_KEY:-}
  IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
  IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
  # Hukuk metni sürümleri
  LEGAL_DISTANCE_SALES_VERSION: ${LEGAL_DISTANCE_SALES_VERSION:-2026-07-15}
  LEGAL_PREINFO_VERSION: ${LEGAL_PREINFO_VERSION:-2026-07-15}
  LEGAL_KVKK_VERSION: ${LEGAL_KVKK_VERSION:-2026-07-15}
  # Güvenlik
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SANCTUM_TOKEN_PREFIX: ${SANCTUM_TOKEN_PREFIX:-sipario_}

services:
  # ── Migration — TEK ATIMLIK, diğer her şeyin ÖNKOŞULU ─────────────────────
  #
  # NEDEN AYRI SERVİS (Coolify'ın "post-deployment command"ı yerine): post-deployment adımı
  # yığın AYAĞA KALKTIKTAN SONRA koşar. Yani `queue` doğduğunda tablolar henüz yoktur ve
  # `queue:work` ilk işinde `relation "cache" does not exist` ile ölür; docker onu yeniden
  # başlatır, migration bitene kadar bu döngü sürer.
  #
  # ÖLÇÜLDÜ (2026-08-10/2, dev sıfırdan kurulumu): `queue` 2 kez yeniden başladı. Zararsız
  # görünüyor ama Coolify'ın tavanı 10'dur ve bu sayı MIGRATION SÜRESİNE bağlıdır — veri
  # büyüdükçe ya da tek bir yavaş migration eklendiğinde 10 aşılır. Aşıldığında ne olduğunu
  # aynı gün yaşadık: `StopApplication` → `CleanupDocker` → `external` ağ silinir → sonraki
  # HER deploy "network not found" ile ölür ve panelden çıkış yolu KALMAZ. Yani bu yarış,
  # üretimi bir saat kapatan zincirin ilk halkasının ta kendisidir.
  #
  # `restart: "no"` ZORUNLU: bu servis bitip çıkmalıdır. Yeniden başlatılırsa
  # `service_completed_successfully` koşulu hiçbir zaman sağlanmaz ve deploy asılı kalır.
  #
  # YAN KAZANÇ: migration başarısız olursa deploy DÜŞER. Eskiden yığın ayağa kalkar, migration
  # ayrı bir adımda düşer ve yarı göçmüş şemayla trafik almaya başlardı.
  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    entrypoint: ["php", "/var/www/html/artisan", "migrate", "--database=pgsql_owner", "--force"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # Miras healthcheck kapatılır — gerekçesi `queue` servisinde uzun uzun yazılı.
    # Burada ayrıca anlamsızdır: tek atımlık bir süreç "sağlıklı" olmaz, BİTER.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Laravel uygulaması (API + site + panel) ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      <<: *app-env
    # Yedek arşivi SALT-OKUNUR (2026-08-15). Panelden yedek indirme route'u
    # (`panel.yedek.indir`) bu dosyaları okur; `:ro` bilinçlidir — yedeği ÜRETEN tek yer
    # `backup` sidecar'ıdır ve uygulama tarafından silinebilen bir yedek, yedek değildir.
    volumes:
      - sipario_backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # GÜNLÜK DÖNDÜRME — `LOG_CHANNEL=stderr`in ZORUNLU eşlikçisi (2026-08-09).
    #
    # stderr'e geçmek günlükleri Docker'ın `json-file` sürücüsüne yönlendirir ve o sürücü
    # VARSAYILAN OLARAK SINIRSIZ BÜYÜR. Döndürme olmadan bu düzeltme, teşhis edilebilirlik
    # kazandırırken diskin dolmasıyla YENİ bir kesinti üretebilirdi — üstelik en kötü anda,
    # uygulama çok log basarken. 3×10 MB, bir kaç günlük çöküş penceresine fazlasıyla yeter.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # ⚠️ `deploy:` BLOĞU KALDIRILDI (2026-08-09) — dekoratifti ve YANLIŞ GÜVEN veriyordu.
    # `update_config.order: start-first` ve `failure_action: rollback` YALNIZ Docker Swarm'da
    # çalışır; Coolify düz `docker compose` kullandığı için bu alanlar sessizce yok sayılıyordu.
    # Kanıt ölçülmüştü: `start-first` gerçekten uygulansaydı kesinti olmamalıydı, oysa iki ayrı
    # deploy'da site 40–60 saniye 503 verdi. Bu satırların durması "rollback beni korur" sanısını
    # besliyordu; gerçek geri dönüş ELLEDİR (Coolify → önceki deployment → Redeploy).
    # Kaldırmak davranışı DEĞİŞTİRMEZ — yalnız belgeyi gerçeğe eşitler.
    # Healthcheck PHP ile yapılır, `curl` ile DEĞİL (2026-08-09).
    #
    # Neden: Coolify uygulamayı aylardır `running:unhealthy` gösteriyordu (MCP ile okundu;
    # `restart_count: 0`, yani container döngüde değildi — site çalışıyor, yalnız SİNYAL bozuktu).
    # En olası sebep `curl`ün bu imajda bulunmaması; `serversideup/php` yalın bir imajdır ve
    # `curl` varlığı garanti değildir. PHP ise tanım gereği var — testi keşfe dayanmayan bir
    # araca bağlamak, "sağlıklı mı" sorusunu tahminden çıkarır.
    #
    # Bozuk healthcheck zararsız görünür ama bedeli ALARM KÖRLÜĞÜDÜR: panel sürekli kırmızıysa
    # gerçek arıza fark edilmez. `deploy:` alanları Swarm dışında yok sayıldığı için bu sinyal
    # bugün otomatik bir davranışı tetiklemiyor — ama Swarm'a geçilirse tetikleyecek.
    #
    # `$` KULLANILMAZ: compose `$` gördüğünde değişken genişletmeye çalışır ($f → boş string).
    # Bu yüzden ifade değişkensiz yazıldı.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') !== false ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Kuyruk işçisi ─────────────────────────────────────────────────────────
  # Aynı imaj, serversideup'ın S6 entrypoint'i yerine doğrudan php artisan çalıştırır.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # ⚠️ `--max-time=3600` KALDIRILDI (2026-08-10, sunucuda ÖLÇÜLEREK bulundu).
    #
    # ÖLÇÜM: `queue` container'ı `RestartCount=8`, `ExitCode=0`, `OOMKilled=false`, `Error=""`.
    # Yaratılış 01:36:48, son başlangıç 09:37:16 — 8 saat 28 saniyede TAM 8 yeniden başlatma,
    # yani saatte bir. `app`, `db`, `scheduler`, `backup` hepsi `RestartCount=0`. Çöküş YOKTU:
    # `--max-time=3600` işçiye "1 saat sonra kendini sonlandır" der ve o da tam olarak bunu
    # yapıyordu, çıkış kodu 0 ile.
    #
    # NEDEN BU ZARARSIZ DEĞİLDİ — üç halkalı zincir:
    #   ① Docker `restart: unless-stopped` altında çıkış kodu 0 ile çöküşü AYIRMAZ; `RestartCount`
    #     her iki halde de artar.
    #   ② Coolify sayaç arttıysa ÇIKIŞ KODUNA BAKMADAN `last_restart_type = 'crash'` yazar
    #     (`app/Actions/Docker/GetContainersStatus.php:474-480`) ve sayacı uygulamanın BÜTÜN
    #     container'larının MAX'ı olarak alır (`:465`) — yani `queue`nun 8'i tüm uygulamanın 8'i
    #     olur. Sayaç yalnız uygulama tamamen `exited` olunca ya da yeni deploy'da sıfırlanır.
    #   ③ `restart_count >= max_restart_count` olunca `StopApplication::dispatch(...)` (`:484`).
    #     Bunun ne demek olduğunu 2026-08-09'da yaşadık: Stop → CleanupDocker → `external` ağ
    #     silinir → sonraki HER deploy "network not found" ile ölür ve panelden çıkış yolu kalmaz.
    #
    # Yani bu bayrak, tavana saatte bir tıklayan bir sayaçtı: ölçüm anında 8/10'daydı ve iki saat
    # sonra üretimi kendi kendine durduracaktı. Her deploy sayacı sıfırlayıp fitili 10 saat sonrası
    # için yeniden kuruyordu — arıza bu yüzden aylarca "arada bir" görünüp teşhis edilmedi.
    #
    # BELLEK KORUMASI KAYBOLMADI: `queue:work` zaten VARSAYILAN `--memory=128` ile koşar; işçi
    # gerçekten şiştiğinde yine çıkar ve yine geri gelir. Fark şu: yeniden başlatma bir TAKVİM
    # olmaktan çıkıp bir OLAY olur. Artık `RestartCount` tırmanıyorsa bir şey ifade eder — ki
    # `max_restart_count` panelde kapatıldığı için (2026-08-10) tek gösterge o sayı.
    #
    # ⚠️ `--max-time`i geri koymak isteyen: önce bu üç halkayı çöz. Bayrağın kendisi doğrudur,
    # yanlış olan onu DOCKER'ın gözetmenliğine bağlamaktır — Docker "planlı çıkış" diye bir kavram
    # tanımaz. Doğru yol container İÇİNDE gözetmen (s6/supervisor) koşurmaktır.
    entrypoint: ["php", "/var/www/html/artisan", "queue:work", "--sleep=3", "--tries=3"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # ⚠️ MİRAS HEALTHCHECK KAPATILDI (2026-08-09, sunucuda ÖLÇÜLEREK bulundu).
    #
    # Temel imaj (serversideup/php) KENDİ healthcheck'ini taşır ve compose'da tanımlamadığımız
    # her serviste o miras kalır:
    #     curl --fail http://localhost:$NGINX_HTTP_PORT$HEALTHCHECK_PATH
    # Bu servis entrypoint'i ezip bir CLI süreci koşuyor — İÇİNDE NGINX YOK. Kontrol 10 saniyede
    # bir "Failed to connect to localhost port 8080" ile düşüyor ve container ömrü boyunca
    # `unhealthy` kalıyordu (docker inspect ile okundu: ExitCode 1, curl (7)).
    #
    # ETKİSİ TEK CONTAINER'LA SINIRLI DEĞİLDİ: Coolify sağlık durumunu toplulaştırıyor, bütün
    # kaynağı `running:unhealthy` gösteriyor ve panelde "Traefik bu kaynağı çalıştırmaz" uyarısı
    # veriyordu — oysa `app` ve `db` ÖLÇÜLDÜ ve ikisi de sağlıklıydı, site kesintisiz çalışıyordu.
    # Asıl bedel ALARM KÖRLÜĞÜ: panel aylardır kırmızı olduğu için 17:01'deki GERÇEK çöküşte o
    # kırmızı hiçbir şey ifade etmedi.
    #
    # NEDEN SAHTE BİR KONTROL YAZMIYORUZ: ön planda koşan bir CLI sürecinde SÜREÇ = CONTAINER.
    # `queue:work` ölürse container ölür ve `restart: unless-stopped` onu geri getirir; ayrı bir
    # canlılık kontrolü hiçbir şey eklemez. `pgrep`/`ps` ile uydurma bir kontrol yazmak ise o
    # araçların imajda VAR OLDUĞUNU varsayardı — bu dosyanın bugün ödediği hatanın aynısı.
    healthcheck:
      disable: true
    # Günlük döndürme — app ile aynı gerekçe (stderr → json-file sınırsız büyür).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Zamanlanmış görev yöneticisi ──────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    entrypoint: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      <<: *app-env
    # `yedek:baglanti-gonder` günlük olarak buradan koşar ve arşivi okur (dosya adı, boyut,
    # tarih). `app` ile aynı gerekçeyle salt-okunur.
    volumes:
      - sipario_backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # ⚠️ MİRAS HEALTHCHECK KAPATILDI — gerekçesi `queue` servisinde uzun uzun yazılı.
    # Özet: temel imajın HTTP kontrolü bu CLI container'ında sonsuza dek düşüyor, tek başına
    # bütün kaynağı `unhealthy` boyuyor ve gerçek arızaları gizliyordu. Süreç = container.
    healthcheck:
      disable: true
    # Günlük döndürme — app ile aynı gerekçe (stderr → json-file sınırsız büyür).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  # Özel Dockerfile ile init betikleri imajın İÇİNE gömülür (mount bağımlılığı yok).
  # ICU tr-TR locale (initdb anında sabitleniyor).
  # 3 rol: sipario_owner (DDL), sipario_app (DML, RLS altında), sipario_panel (cross-tenant SELECT).
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sipario}
      POSTGRES_USER: ${DB_OWNER_USERNAME:-sipario_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      # Rol parolaları, uygulamanın BAĞLANDIĞI değişken adlarıyla birebir aynı geçilir.
      # Eskiden SIPARIO_APP_PASSWORD / SIPARIO_PANEL_PASSWORD diye ikinci bir ad vardı;
      # kaldırıldı çünkü aynı sırrın iki adı, panelde yalnız birinin güncellenmesine ve
      # farkın ancak üretimde görülmesine açık kapı bırakıyordu.
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PANEL_PASSWORD: ${DB_PANEL_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_INITDB_ARGS: >-
        --locale-provider=icu
        --icu-locale=tr-TR
        --lc-collate=C.UTF-8
        --lc-ctype=C.UTF-8
        --encoding=UTF8
    volumes:
      - sipario_pgdata_v4:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipario_owner -d sipario"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Yedekleme sidecar ─────────────────────────────────────────────────────
  # Günlük pg_dump + sıkıştırma. Saklama: 7 günlük, 4 haftalık, 6 aylık.
  # Betik imajın içine gömülüdür (docker/backup/Dockerfile).
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    environment:
      PGHOST: db
      PGUSER: ${DB_OWNER_USERNAME:-sipario_owner}
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      PGDATABASE: ${DB_DATABASE:-sipario}
    volumes:
      - sipario_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sipario_pgdata_v4:
  sipario_backups:
