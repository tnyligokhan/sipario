name: sipario
description: "Sipario — sipariş, veresiye defteri ve kurye takibi."
publish_to: 'none'

# SÜRÜM — UYGULAMA hattının TEK doğru yeri (SemVer kuralı: CLAUDE.md → "Sürümleme").
#
# API'nin sürümü AYRIDIR (`apps/api/config/app.php` → 'version') ve buna eşitlenmez: ikisini
# aynı numaraya bağlamak, ikisinden birinin numarasını anlamsız kılar.
#
# ARTIRMA: kullanıcıya görünen her değişiklik en az PATCH artırır. MINOR = geriye dönük uyumlu
# yeni davranış. MAJOR = eski istemcinin sunucuyla çalışamaması — bu projede büyük bir olaydır,
# çünkü telefonlar offline-first çalışır ve günlerce eski sürümde kalabilir.
# 1.0.0 mağaza çıkışına saklanıyor (pilot boyunca 0.x).
#
# YAPI NUMARASI (+1) BURADAN KULLANILMAZ ve SÜRÜM DEĞİLDİR: `android/app/build.gradle.kts` onu
# git commit sayısından türetir; makinenin karşılaştırma anahtarıdır (Play daha küçük
# versionCode'u reddeder, uygulama içi güncelleme "uzaktaki benden yeni mi?"yi tam sayıyla çözer).
# Buradaki +1 yalnız git'in bulunamadığı durumda (depo dışı derleme) yedek değerdir.
version: 0.11.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Faz 0: native tarafın salt-okunur açacağı SQLite dosyasını Flutter yazar.
  # Faz 0 ölçüm ekranı hâlâ kullanır; ürün DB'si Faz 2'de Drift'e devredildi.
  sqflite: ^2.4.1
  path: ^1.9.0

  # Faz 2: ürünün yerel veritabanı. sipario.db dosya adı + customers/customer_phones/phone_last10
  # sözleşmesi native arayan-tanıma tarafı için KORUNUR (DECISIONS Faz 0).
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.5.0                # UUIDv7 istemcide (uuid.v7()) — offline-first kimlik
  http: ^1.2.2               # senkron push/pull taşıması
  connectivity_plus: ^6.0.5  # ağ tetiği (online olunca gönderici koşar)

  # Ürün görseli seçimi (tasarım s-urunler.jsx: gerçek dosya seçici). Seçilen dosyanın YOLU
  # `products.image_local_path` kolonuna yazılır — cihaz-yerel, senkronlanmaz. Yükleme boru
  # hattı (nesne deposu → products.image_url) hâlâ açık iş.
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.0

  # Sipariş/müşteri kartındaki Ara · WhatsApp · Konum düğmeleri harici uygulama açar
  # (tel: · whatsapp:// · geo:). Saha hatası 3: düğmeler duruyordu ama yalnız toast gösteriyordu.
  # Native köprü yazmak yerine bu paket: iOS'ta da çalışır ve hedef uygulama yoksa çökmez,
  # ActivityNotFoundException'ı yutup false döner (gerekçeyi biz Türkçe söyleriz).
  url_launcher: ^6.3.2

  # Müşteri formunda sesli giriş (ad · adres · bölge · not). Esnafın klavye toleransı düşük;
  # bayi isteği "inputların yanında mikrofon işareti olabilir".
  # NEDEN BU PAKET: bakımı süren tek olgun seçenek; Android SpeechRecognizer + iOS
  # SFSpeechRecognizer'ı tek API'de veriyor, dil seçimi (tr_TR) ve izin akışı içinde.
  # Elenenler: google_speech (bulut gRPC + API anahtarı — müşteri adı/adresi Google'a giderdi,
  # kırmızı çizgi #4), vosk_flutter (gerçekten çevrimdışı ama ~50 MB model gömmek gerekir ve
  # paket olgun değil), flutter_speech (terk edilmiş).
  speech_to_text: ^7.4.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  package_info_plus: ^10.2.1

  # "Konum Güncelle" — kuryenin/bayinin BULUNDUĞU noktayı müşterinin adresine yazar. Adresten
  # kodlama (Yandex) kapının önünü değil sokağı bulur; doğru pin ancak orada durup alınır.
  # NEDEN BU PAKET: izin akışı (reddedildi / kalıcı reddedildi / konum servisi kapalı) ayrı ayrı
  # ayırt edilebiliyor — kullanıcıya "izin verin" ile "GPS'i açın" farkını söyleyebiliyoruz.
  # SADECE ÖN PLAN konumu kullanılır; arka plan izni (ACCESS_BACKGROUND_LOCATION) İSTENMEZ —
  # Play'in kısıtlı izin beyan formunu tetikler (kırmızı çizgi #6 ile aynı mantık) ve ihtiyaç yok.
  geolocator: ^14.0.3

  # Sipariş haritası — açık siparişlerin pinleri, oto sıralama sonrası rota sırasıyla numaralı.
  # NEDEN BU PAKET: harita motoru SAF DART — google_maps_flutter gibi API anahtarı + Play
  # Services + iOS SDK gerektirmez; karolar OSM'den gelir, APK'ya gömülecek sır yoktur ve widget
  # testi karo sağlayıcı dikişi sayesinde ağa hiç çıkmaz. DÜRÜSTLÜK NOTU (inceleme 2026-07-29):
  # "hiç native kod gelmedi" DENEMEZ — flutter_map'in path_provider bağımlılığı Android'e
  # jni/jni_flutter native eklentilerini geçişli getirir. Fark şu: bunlar HARİTA ÇİZİMİNDE değil
  # yalnız karo önbelleği yol çözümünde devrededir; harita widget'ı platform kanalına uzanmaz,
  # widget testleri bu yüzden kırılmaz (bu depoda platform kanallı widget iki kez test kırdı).
  # latlong2 flutter_map'in koordinat tipidir (LatLng) — ayrı bir seçim değil, zorunlu eşlikçi.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  # Saha bulgusu (2026-07-29): "harita çok kasıyor". Varsayılan sağlayıcı başladığı karo
  # indirmesini bitirir; hızlı kaydırmada görünürlükten çıkmış onlarca karo inip çözülmeye devam
  # eder ve kuyruk ana iş parçacığını boğar. Bu resmî tamamlayıcı, kadraj dışına düşen karonun
  # isteğini ANINDA iptal eder (flutter_map belgelerinin performans önerisi).
  flutter_map_cancellable_tile_provider: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift kod üretimi (yerel DB şeması → tip güvenli erişim)
  drift_dev: ^2.22.0
  build_runner: ^2.5.4

  # migration_test.dart phase0 (v1) şemasını ham sqlite3 ile kurar (drift'in çekirdek bağımlılığı;
  # testte DOĞRUDAN kullanıldığından açıkça listelenir). Codegen override'ıyla çelişmez (o kapalı).
  sqlite3: ^3.3.0

flutter:
  uses-material-design: true

  # SİPARİO 3.0 tasarım sistemi fontları (OFL, assets/fonts'a gömülü; offline-first: runtime
  # indirme YOK). İkisi de DEĞİŞKEN font — tek dosya tüm ağırlıkları taşır; ağırlık
  # typography.dart'ta `fontVariations: [FontVariation('wght', N)]` ile verilir.
  #   Sora          → başlıklar ve rakamlar (CSS --font-d)
  #   HankenGrotesk → gövde metni (CSS --font-b)
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf

# Codegen notu (KOD ÜRETİMİ İÇİN GEÇİCİ): sqlite3'ün native build-hook'u (hook/build.dart) Dart
# 3.10'da `dart run build_runner`ın AOT derlemesini kırıyor ("dart compile does not support build
# hooks"). Faz 3'te doğrulandı: hook'suz SON sürüm 2.9.4 (3.2.0 ve 3.4.0 hook'lu) — bu yüzden sınır
# `<3.0.0` (eski not `<3.3` yanılıyordu, 3.2.0 sonradan hook kazandı). Drift .g.dart'ı yeniden üretmen
# gerekirse ÖNCE aşağıdaki override'ı aç, `flutter pub get && dart run build_runner build`, SONRA
# override'ı yine kapat ve `flutter pub get` (runtime + flutter test sqlite3 3.x ister).
# Üretilen kod sqlite3 sürümünden bağımsızdır; override'ı kapalı bırakmak normal durumdur.
# dependency_overrides:
#   sqlite3: ">=2.4.0 <3.0.0"
