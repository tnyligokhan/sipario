services:
  db:
    # `image:` DEĞİL `build:` — rol eşitleyicisi imajın entrypoint'inde yaşıyor ve hazır
    # postgres imajı onu taşımaz. Yerel yığın üretimden ayrılırsa, üretimi düşüren sınıftan
    # bir arıza burada bir daha ölçülemez hâle gelir.
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: sipario_db
    environment:
      POSTGRES_DB: sipario
      # DB sahibi + migration rolü (imajda superuser). Runtime app rolü init betiğinde kurulur.
      POSTGRES_USER: sipario_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-sipario_owner_dev}
      # Rol parolaları, uygulamanın BAĞLANDIĞI adlarla birebir aynı (config/database.php).
      # Eski adlar (SIPARIO_APP_PASSWORD, DB_APP_PASSWORD) kaldırıldı: aynı sır için üç ayrı
      # ad vardı ve hangisinin yürürlükte olduğu ancak container'ın içine bakınca anlaşılıyordu.
      DB_PASSWORD: ${DB_PASSWORD:-sipario_app_dev}
      DB_PANEL_PASSWORD: ${DB_PANEL_PASSWORD:-sipario_panel_dev}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-sipario_owner_dev}
      # Postgres 16 ICU: Türkçe sıralama/case (ç,ş,ğ,ı,ö,ü). libc tr_TR.UTF-8 imajda yok, ICU var.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=tr-TR --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8 --encoding=UTF8"
    ports:
      # Host portu bilinçli olarak 5432 DEĞİL: geliştirici makinelerinde Laragon vb. ile
      # gelen yerli PostgreSQL 5432'yi tutuyor; standart port kullanılsaydı uygulama
      # sessizce yanlış sunucuya bağlanabilirdi. Konteyner içi port 5432 kalır.
      - "55432:5432"
    volumes:
      - sipario_pgdata:/var/lib/postgresql/data
      # init betikleri artık imajın İÇİNDE (bkz. docker/postgres/Dockerfile). Bind-mount
      # kaldırıldı: mount, imajdaki dizini gölgeleyip yerelde üretimden farklı bir betik
      # kümesinin koşmasına yol açıyordu.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipario_owner -d sipario"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sipario_pgdata:
